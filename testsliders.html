<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MERIDIAN — The Atlas Edition | Luxury Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Manrope:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --navy: #0d1b3e;
      --navy-mid: #1b2f5e;
      --navy-soft: #2a4080;
      --amber: #f59e0b;
      --amber-dark: #d97706;
      --amber-light: #fef3c7;
      --white: #fff;
      --bg: #fafbff;
      --bg-blue: #eef4ff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --border-soft: #f1f5f9;

      --ink: var(--navy);
      --ink-soft: var(--navy-mid);
      --ivory: var(--white);
      --ivory-60: rgba(255,255,255,0.7);
      --ivory-35: rgba(255,255,255,0.45);
      --ivory-16: rgba(255,255,255,0.2);
      --bronze: var(--amber);
      --bronze-soft: rgba(245,158,11,0.5);
      --accent: var(--amber-dark);
      --glass-bg: rgba(13,27,62,0.3);
      --glass-border: rgba(255,255,255,0.15);

      --display: 'Bodoni Moda', serif;
      --body: 'Manrope', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--navy);
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: var(--body);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(175deg, var(--navy-mid) 0%, var(--navy) 45%, #060e1f 100%);
    }

    /* darkening overlay so text stays legible over full-bleed photos */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(6,10,25,0.75) 0%, rgba(6,10,25,0.25) 45%, rgba(6,10,25,0.15) 100%),
        linear-gradient(0deg, rgba(6,10,25,0.75) 0%, transparent 35%),
        radial-gradient(ellipse 140% 100% at 50% 50%, transparent 40%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
      z-index: 6;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 6;
    }

    /* ---------- TOP BAR ---------- */
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 34px 48px;
      z-index: 20;
      backdrop-filter: blur(4px);
    }

    .logo {
      font-family: var(--display);
      font-size: 20px;
      letter-spacing: 0.28em;
      font-weight: 500;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      color: var(--white);
    }
    .logo span { color: var(--amber); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 28px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--ivory-60);
      text-transform: uppercase;
      background: rgba(13,27,62,0.5);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .topbar-right .divider { width: 1px; height: 12px; background: var(--ivory-16); }

    /* ---------- BACKGROUND TITLES (all three shown at once) ---------- */
    .bg-title-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 1.2vh;
      padding-left: 2vw;
      pointer-events: none;
    }

    .bg-title-item {
      font-family: var(--display);
      font-weight: 600;
      font-style: italic;
      text-transform: uppercase;
      font-size: clamp(52px, 8vw, 130px);
      line-height: 0.88;
      color: var(--white);
      opacity: 0.07;
      white-space: nowrap;
      letter-spacing: -0.01em;
      transform: scale(0.94) translateX(0);
      transform-origin: left center;
      transition: opacity 0.6s ease, transform 0.6s ease, color 0.6s ease;
      will-change: opacity, transform;
    }

    .bg-title-item.active {
      opacity: 0.18;
      color: var(--amber-light);
      transform: scale(1) translateX(6px);
    }

    /* ---------- FLOATING CLOUD ---------- */
    .cloud-layer {
      position: absolute;
      left: -4%;
      top: 5%;
      width: 50vw;
      height: 75vh;
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: soft-light;
      filter: blur(45px);
      opacity: 0.5;
    }
    .cloud-blob { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(254,243,199,0.7) 0%, rgba(245,158,11,0.25) 45%, transparent 80%); }
    .cb1 { width: 380px; height: 340px; top: 8%; left: 5%; }
    .cb2 { width: 300px; height: 290px; top: 38%; left: 28%; background: radial-gradient(circle at 40% 40%, rgba(254,243,199,0.5) 0%, rgba(217,119,6,0.15) 60%, transparent 85%); }
    .cb3 { width: 360px; height: 260px; top: 60%; left: 2%; background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, rgba(245,158,11,0.1) 70%, transparent 90%); }

    /* ---------- IMAGE LAYER — now full-bleed background ---------- */
    .visual-rail {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      will-change: transform;
    }

    .visual-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
      will-change: transform, filter, opacity, clip-path;
      background: #1a1c1e;
    }

    .visual-frame.stacked { z-index: 1; }
    .visual-frame.active { z-index: 2; }

    .visual-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.08);
      will-change: transform;
    }

    .visual-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.4;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }
    .glow-1 { width: 45%; height: 35%; top: -5%; right: 5%; background: rgba(254,243,199,0.4); }
    .glow-2 { width: 55%; height: 40%; bottom: -8%; left: -5%; background: rgba(13,27,62,0.5); }

    .visual-grain { position: absolute; inset: 0; opacity: 0.08; mix-blend-mode: overlay; pointer-events: none; }

    /* ---------- FOREGROUND TEXT ---------- */
    .foreground {
      position: absolute;
      left: 6vw;
      bottom: 10vh;
      z-index: 10;
      max-width: 36vw;
      text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .category {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 18px;
      opacity: 0;
      backdrop-filter: blur(2px);
      display: inline-block;
      padding: 4px 0;
    }
    .category::before { content: '—— '; color: var(--ivory-35); }

    .heading {
      font-family: var(--display);
      font-size: clamp(40px, 4.2vw, 66px);
      line-height: 1.05;
      font-weight: 500;
      margin: 0 0 22px 0;
      overflow: hidden;
      color: var(--white);
    }
    .heading .word-wrap { display: inline-block; overflow: hidden; vertical-align: top; }
    .heading .word { display: inline-block; transform: translateY(110%); will-change: transform; }

    .paragraph {
      font-size: 16px;
      line-height: 1.7;
      color: var(--ivory-60);
      font-weight: 300;
      max-width: 440px;
      margin: 0 0 34px 0;
      opacity: 0;
      transform: translateY(16px);
      letter-spacing: 0.01em;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--navy);
      background: var(--amber);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 17px 30px;
      border-radius: 100px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      transition: background 0.3s ease, box-shadow 0.4s ease, transform 0.3s ease, color 0.3s;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      font-weight: 500;
    }
    .cta:hover {
      background: var(--amber-light);
      color: #0d1b3e;
      box-shadow: 0 0 0 1px var(--amber), 0 18px 40px rgba(245,158,11,0.5);
      transform: translateY(-3px);
    }
    .cta svg { width: 15px; height: 15px; }

    /* ---------- THUMB RAIL ---------- */
    .thumb-rail {
      position: absolute;
      right: 2vw;
      top: 0; bottom: 0;
      width: 180px;
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .thumb-slot { position: relative; display: flex; align-items: center; justify-content: center; margin: 12px 0; }
    .thumb {
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--amber-light);
      box-shadow: 0 14px 35px rgba(0,0,0,0.6);
      cursor: pointer;
      will-change: width, height, transform;
      background: #1e2123;
      transition: border-color 0.2s ease;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, rgba(255,255,255,0.5) 0%, transparent 50%, rgba(0,0,0,0.3) 100%);
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    .orbit-svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; overflow: visible; }

    /* ---------- CONNECTOR + LABEL ---------- */
    .connector { position: absolute; right: 15vw; z-index: 11; display: flex; align-items: center; pointer-events: none; top: 50%; transform: translateY(-50%); }
    .connector-line { height: 1px; width: 130px; background: linear-gradient(90deg, transparent, var(--amber) 95%); transform: scaleX(0); transform-origin: right center; will-change: transform; }

    .dest-label { position: absolute; right: calc(15vw + 145px); top: 50%; transform: translateY(-50%); z-index: 11; text-align: right; width: 270px; text-shadow: 0 8px 20px rgba(0,0,0,0.7); }
    .dest-name { font-family: var(--display); font-style: italic; font-size: 24px; margin: 0 0 6px 0; font-weight: 500; color: var(--white); }
    .dest-desc { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ivory-35); margin: 0; }
    .dest-coord { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--amber); margin-top: 8px; }

    /* ---------- NAV ARROWS ---------- */
    .nav-arrows { position: absolute; left: 6vw; bottom: 3.5vh; z-index: 20; display: flex; gap: 16px; }
    .arrow-btn {
      width: 54px; height: 54px; border-radius: 50%;
      border: 1px solid var(--ivory-16);
      background: rgba(13,27,62,0.6);
      backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--white);
      transition: transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s, background 0.35s, border-color 0.35s;
      box-shadow: 0 0 0 1px rgba(245,158,11,0.2);
    }
    .arrow-btn:hover { transform: scale(1.1); background: rgba(245,158,11,0.2); border-color: var(--amber); box-shadow: 0 0 35px rgba(245,158,11,0.5); }
    .arrow-btn svg { width: 19px; height: 19px; }

    .progress { position: absolute; left: 6vw; bottom: 1.2vh; z-index: 20; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--ivory-35); }
    .progress b { color: var(--amber); font-weight: 500; }

    .wave-layer { position: absolute; inset: 0; z-index: 9; pointer-events: none; overflow: visible; }

    @media (max-width: 980px) {
      .foreground { max-width: 85vw; left: 5vw; bottom: 6vh; }
      .thumb-rail { display: none; }
      .connector, .dest-label { display: none; }
      .bg-title-item { font-size: 15vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
<div class="hero" id="hero">
  <svg class="grain" width="100%" height="100%">
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#noise)"/>
  </svg>

  <div class="topbar">
    <div class="logo">MERIDIAN<span>.</span></div>
    <div class="topbar-right">
      <span>The Atlas Edition</span>
      <div class="divider"></div>
      <span id="slideCounter">01 / 03</span>
    </div>
  </div>

  <!-- full-bleed photo layer -->
  <div class="visual-rail" id="visualRail"></div>

  <!-- all three titles rendered together -->
  <div class="bg-title-layer" id="bgTitleLayer"></div>

  <div class="cloud-layer" id="cloud">
    <div class="cloud-blob cb1"></div>
    <div class="cloud-blob cb2"></div>
    <div class="cloud-blob cb3"></div>
  </div>

  <svg class="wave-layer" id="waveLayer"></svg>

  <div class="foreground">
    <div class="category" id="category"></div>
    <h1 class="heading" id="heading"></h1>
    <p class="paragraph" id="paragraph"></p>
    <button class="cta" id="ctaBtn">
      <span id="ctaText">Reserve the Journey</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="connector" id="connectorWrap">
    <div class="connector-line" id="connectorLine"></div>
  </div>
  <div class="dest-label" id="destLabel">
    <div class="dest-name" id="destName"></div>
    <div class="dest-desc" id="destDesc"></div>
    <div class="dest-coord" id="destCoord"></div>
  </div>

  <div class="thumb-rail" id="thumbRail"></div>

  <div class="nav-arrows">
    <div class="arrow-btn" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </div>
    <div class="arrow-btn" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>
  <div class="progress"><b id="progIndex">01</b> — 03</div>
</div>

<script>
  (function() {
    // ----- REPLACE these with your own transparent-background images -----
    const PLACEHOLDER_IMAGES = {
      kyoto: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=2070&auto=format&fit=crop',
      santorini: 'https://images.unsplash.com/photo-1613395877344-13d4a8e0d49e?q=80&w=2070&auto=format&fit=crop',
      patagonia: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?q=80&w=2070&auto=format&fit=crop'
    };

    const SLIDES = [
      {
        title: 'KYOTO',
        image: PLACEHOLDER_IMAGES.kyoto,
        category: 'ASIA · HONSHU',
        heading: 'The Quiet Architecture of Autumn',
        paragraph: 'Maple corridors, temple bells, and a stillness that has outlived a thousand years. Travel privately through Kyoto\u2019s inner gardens before the gates open to anyone else.',
        name: 'Kyoto, Japan',
        desc: 'Higashiyama District',
        coord: '35.0116° N · 135.7681° E'
      },
      {
        title: 'SANTORINI',
        image: PLACEHOLDER_IMAGES.santorini,
        category: 'AEGEAN · CYCLADES',
        heading: 'Where the Caldera Meets the Sky',
        paragraph: 'Whitewashed cliffs suspended above a volcanic sea, lit gold at the hour when the ferries have gone quiet. A private terrace, and nowhere else to be.',
        name: 'Santorini, Greece',
        desc: 'Oia, Cycladic Islands',
        coord: '36.3932° N · 25.4615° E'
      },
      {
        title: 'PATAGONIA',
        image: PLACEHOLDER_IMAGES.patagonia,
        category: 'SOUTH AMERICA · CHILE',
        heading: 'Silence at the Edge of the World',
        paragraph: 'Granite towers cut from glacial wind, a horizon with no fence in sight. Torres del Paine, reached the way it was meant to be: slowly, and alone.',
        name: 'Torres del Paine',
        desc: 'Magallanes, Chile',
        coord: '50.9423° S · 73.4068° W'
      }
    ];

    let active = 0;
    let isAnimating = false;
    let autoInterval;

    const bgTitleLayer = document.getElementById('bgTitleLayer');
    const visualRail = document.getElementById('visualRail');
    const thumbRail = document.getElementById('thumbRail');
    const waveLayer = document.getElementById('waveLayer');
    const category = document.getElementById('category');
    const heading = document.getElementById('heading');
    const paragraph = document.getElementById('paragraph');
    const ctaBtn = document.getElementById('ctaBtn');
    const connectorLine = document.getElementById('connectorLine');
    const destName = document.getElementById('destName');
    const destDesc = document.getElementById('destDesc');
    const destCoord = document.getElementById('destCoord');
    const slideCounter = document.getElementById('slideCounter');
    const progIndex = document.getElementById('progIndex');

    function pad(n) { return (n + 1).toString().padStart(2, '0'); }

    function visualInner(imageUrl) {
      return `<img src="${imageUrl}" alt="destination" class="visual-img" />
              <div class="visual-glow glow-1"></div>
              <div class="visual-glow glow-2"></div>
              <svg class="visual-grain" width="100%" height="100%"><rect width="100%" height="100%" filter="url(#noise)"/></svg>`;
    }

    function splitWords(el, text) {
      el.innerHTML = '';
      text.split(' ').forEach((w, i, arr) => {
        const wrap = document.createElement('span');
        wrap.className = 'word-wrap';
        const word = document.createElement('span');
        word.className = 'word';
        word.textContent = w + (i < arr.length - 1 ? '\u00A0' : '');
        wrap.appendChild(word);
        el.appendChild(wrap);
      });
      return el.querySelectorAll('.word');
    }

    // ----- render all three destination titles at once -----
    function buildBgTitles() {
      bgTitleLayer.innerHTML = '';
      SLIDES.forEach((slide, i) => {
        const div = document.createElement('div');
        div.className = 'bg-title-item' + (i === active ? ' active' : '');
        div.textContent = slide.title;
        div.dataset.index = i;
        bgTitleLayer.appendChild(div);
      });
    }
    buildBgTitles();

    function setActiveBgTitle(i) {
      bgTitleLayer.querySelectorAll('.bg-title-item').forEach((el) => {
        el.classList.toggle('active', Number(el.dataset.index) === i);
      });
    }

    // Initial visual frame
    let currentFrame = document.createElement('div');
    currentFrame.className = 'visual-frame active';
    currentFrame.innerHTML = visualInner(SLIDES[0].image);
    visualRail.appendChild(currentFrame);
    gsap.to(currentFrame.querySelector('.visual-img'), { scale: 1.14, x: 10, duration: 18, ease: 'sine.inOut', yoyo: true, repeat: -1 });

    // Thumbnails
    const SIZES = { prev: 70, active: 140, next: 92 };
    const slotOrder = ['next', 'active', 'prev'];

    function buildThumbs() {
      thumbRail.innerHTML = '';
      slotOrder.forEach((role) => {
        const idx = role === 'active' ? active : role === 'next' ? (active + 1) % 3 : (active + 2) % 3;
        const slot = document.createElement('div');
        slot.className = 'thumb-slot';
        const size = SIZES[role];
        slot.style.zIndex = role === 'active' ? 3 : 1;

        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        thumb.style.width = size + 'px';
        thumb.style.height = size + 'px';
        thumb.style.opacity = role === 'active' ? '1' : '0.65';
        thumb.dataset.index = idx;
        thumb.innerHTML = `<img src="${SLIDES[idx].image}" alt="thumb">`;
        thumb.addEventListener('click', () => { if (idx !== active) resetAutoAndGo(idx); });
        slot.appendChild(thumb);

        if (role === 'active') {
          const svgNS = 'http://www.w3.org/2000/svg';
          const svg = document.createElementNS(svgNS, 'svg');
          svg.setAttribute('class', 'orbit-svg');
          svg.setAttribute('width', size + 70);
          svg.setAttribute('height', size + 70);
          svg.innerHTML = [
            { dash: 'none', opacity: 0.3, width: 1.2 },
            { dash: '3 9', opacity: 0.5, width: 1 },
            { dash: 'none', opacity: 0.2, width: 0.8 }
          ].map((style, i) => {
            const r = size / 2 + 16 + i * 14;
            return `<circle cx="${(size + 70) / 2}" cy="${(size + 70) / 2}" r="${r}" fill="none"
                    stroke="rgba(245,158,11,${style.opacity})" stroke-width="${style.width}"
                    stroke-dasharray="${style.dash}" class="orbit-ring" data-r="${r}"/>`;
          }).join('');
          slot.appendChild(svg);
          gsap.to(svg, { rotation: 360, duration: 38, repeat: -1, ease: 'none', transformOrigin: '50% 50%' });
        }

        gsap.to(slot, { y: role === 'active' ? -7 : 7, duration: 5 + Math.random(), repeat: -1, yoyo: true, ease: 'sine.inOut' });
        thumbRail.appendChild(slot);
      });
    }
    buildThumbs();

    function fillForeground(i) {
      category.textContent = SLIDES[i].category;
      splitWords(heading, SLIDES[i].heading);
      paragraph.textContent = SLIDES[i].paragraph;
      destName.textContent = SLIDES[i].name;
      destDesc.textContent = SLIDES[i].desc;
      destCoord.textContent = SLIDES[i].coord;
      slideCounter.textContent = pad(i) + ' / 03';
      progIndex.textContent = pad(i);

      gsap.set(category, { opacity: 1 });
      gsap.set(heading.querySelectorAll('.word'), { y: 0, opacity: 1 });
      gsap.set(paragraph, { opacity: 1, y: 0 });
      gsap.set(ctaBtn, { opacity: 1, y: 0 });
      gsap.set(connectorLine, { scaleX: 1 });
      gsap.set([destName, destDesc, destCoord], { opacity: 1, y: 0 });
    }
    fillForeground(0);

    // Parallax (kept subtle so full-bleed image never shows edges)
    const heroEl = document.getElementById('hero');
    const qy = gsap.quickTo(visualRail, 'y', { duration: 1.4, ease: 'power3.out' });
    const qx = gsap.quickTo(visualRail, 'x', { duration: 1.4, ease: 'power3.out' });
    heroEl.addEventListener('mousemove', (e) => {
      const px = (e.clientX / window.innerWidth - 0.5);
      const py = (e.clientY / window.innerHeight - 0.5);
      qx(px * -14);
      qy(py * 10);
    });

    function fireWave(originX, originY) {
      const svgNS = 'http://www.w3.org/2000/svg';
      for (let i = 0; i < 4; i++) {
        const c = document.createElementNS(svgNS, 'circle');
        c.setAttribute('cx', originX);
        c.setAttribute('cy', originY);
        c.setAttribute('r', 15);
        c.setAttribute('fill', 'none');
        c.setAttribute('stroke', i % 2 === 0 ? 'rgba(254,243,199,0.6)' : 'rgba(245,158,11,0.6)');
        c.setAttribute('stroke-width', i === 0 ? 1.8 : 0.9);
        waveLayer.appendChild(c);
        gsap.fromTo(c, { attr: { r: 15 }, opacity: 0.9 }, {
          attr: { r: 580 + i * 100 },
          opacity: 0,
          duration: 1.0 + i * 0.12,
          delay: i * 0.07,
          ease: 'power2.out',
          onComplete: () => c.remove()
        });
      }
    }

    function goTo(nextIndex) {
      if (isAnimating || nextIndex === active) return;
      isAnimating = true;
      active = nextIndex;

      const activeThumbSlot = thumbRail.querySelector('.thumb-slot:nth-child(2)');
      const rect = activeThumbSlot ? activeThumbSlot.getBoundingClientRect() : { left: window.innerWidth - 160, top: window.innerHeight / 2, width: 140, height: 140 };
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      const railRect = visualRail.getBoundingClientRect();
      const clipOriginX = ((originX - railRect.left) / railRect.width) * 100;
      const clipOriginY = ((originY - railRect.top) / railRect.height) * 100;

      const master = gsap.timeline({ onComplete: () => { isAnimating = false; } });

      // Background titles — just re-highlight the active one
      master.call(() => setActiveBgTitle(active), null, 0.1);

      // Image reveal
      const oldFrame = currentFrame;
      const newFrame = document.createElement('div');
      newFrame.className = 'visual-frame active';
      newFrame.innerHTML = visualInner(SLIDES[active].image);
      visualRail.appendChild(newFrame);
      currentFrame = newFrame;

      gsap.set(newFrame, {
        opacity: 0,
        scale: 1.12,
        filter: 'blur(12px)',
        clipPath: `circle(0% at ${clipOriginX}% ${clipOriginY}%)`
      });

      master.to(oldFrame, { scale: 1.08, opacity: 0, filter: 'blur(8px)', duration: 1.0, ease: 'power3.in' }, 0);
      master.to(newFrame, {
        opacity: 1,
        scale: 1,
        filter: 'blur(0px)',
        clipPath: 'circle(150% at 50% 50%)',
        duration: 1.25,
        ease: 'power4.out',
        onComplete: () => {
          oldFrame.remove();
          gsap.to(newFrame.querySelector('.visual-img'), { scale: 1.14, x: 10, duration: 18, ease: 'sine.inOut', yoyo: true, repeat: -1 });
        }
      }, 0.05);

      // Wave ripple
      master.call(() => fireWave(originX, originY), null, 0.02);

      // Orbit burst
      const rings = thumbRail.querySelectorAll('.orbit-ring');
      master.to(rings, { scale: 1.6, opacity: 0, duration: 0.35, ease: 'power2.in' }, 0.02);

      // Thumbnail morph
      master.call(() => { buildThumbs(); }, null, 0.3);
      master.call(() => {
        gsap.from(thumbRail.querySelectorAll('.thumb'), { scale: 0.7, opacity: 0, duration: 0.75, ease: 'elastic.out(1,0.8)', stagger: 0.07 });
        gsap.fromTo(thumbRail.querySelectorAll('.orbit-ring'), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.65, ease: 'power3.out' });
      }, null, 0.32);

      // Connector
      master.to(connectorLine, { scaleX: 0, duration: 0.3, ease: 'power2.in' }, 0);
      master.set(connectorLine, { scaleX: 0 }, 0.32);
      master.to(connectorLine, { scaleX: 1, duration: 0.65, ease: 'power3.out' }, 0.38);

      // Destination label
      master.to([destName, destDesc, destCoord], { y: -16, opacity: 0, duration: 0.3, ease: 'power2.in' }, 0);
      master.call(() => {
        destName.textContent = SLIDES[active].name;
        destDesc.textContent = SLIDES[active].desc;
        destCoord.textContent = SLIDES[active].coord;
        gsap.set([destName, destDesc, destCoord], { y: 16, opacity: 0 });
      }, null, 0.36);
      master.to([destName, destDesc, destCoord], { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out', stagger: 0.06 }, 0.52);

      // Foreground text
      master.to(category, { opacity: 0, y: -10, duration: 0.25 }, 0);
      master.to(paragraph, { opacity: 0, y: -10, duration: 0.25 }, 0);
      master.to(ctaBtn, { opacity: 0, y: -10, duration: 0.25 }, 0);
      const oldWords = heading.querySelectorAll('.word');
      master.to(oldWords, { y: '-110%', duration: 0.4, ease: 'power3.in', stagger: 0.02 }, 0);

      master.call(() => {
        category.textContent = SLIDES[active].category;
        paragraph.textContent = SLIDES[active].paragraph;
        const words = splitWords(heading, SLIDES[active].heading);
        gsap.set(words, { y: '110%' });
        gsap.set(category, { opacity: 0, y: 10 });
        gsap.set(paragraph, { opacity: 0, y: 14 });
        gsap.set(ctaBtn, { opacity: 0, y: 14 });
      }, null, 0.42);

      master.to(category, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.45);
      master.call(() => {
        gsap.to(heading.querySelectorAll('.word'), { y: '0%', duration: 0.6, ease: 'power4.out', stagger: 0.04 });
      }, null, 0.52);
      master.to(paragraph, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.7);
      master.to(ctaBtn, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.82);

      master.call(() => {
        slideCounter.textContent = pad(active) + ' / 03';
        progIndex.textContent = pad(active);
      }, null, 0.4);
    }

    function resetAutoAndGo(index) {
      clearInterval(autoInterval);
      goTo(index);
      startAutoCycle();
    }

    function startAutoCycle() {
      clearInterval(autoInterval);
      autoInterval = setInterval(() => {
        if (!isAnimating) {
          goTo((active + 1) % 3);
        }
      }, 6000);
    }

    document.getElementById('nextBtn').addEventListener('click', () => resetAutoAndGo((active + 1) % 3));
    document.getElementById('prevBtn').addEventListener('click', () => resetAutoAndGo((active + 2) % 3));

    startAutoCycle();

    gsap.utils.toArray('.cloud-blob').forEach((b, i) => {
      gsap.to(b, {
        x: (i % 2 === 0 ? 1 : -1) * (35 + i * 12),
        y: (i % 2 === 0 ? -1 : 1) * (25 + i * 10),
        scale: 1.15,
        duration: 10 + i * 2.5,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut'
      });
    });

    gsap.to('.arrow-btn', { boxShadow: '0 0 0 1px rgba(245,158,11,0.3)', duration: 3.5, repeat: -1, yoyo: true, ease: 'sine.inOut' });
  })();
</script>
</body>
</html>
